[project]
name = "scam-shield"
version = "0.1.0"
description = "Scam Shield: flag scam SMS and WhatsApp messages with Jev"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "scikit-learn>=1.5"]

[project.scripts]
shield = "shield.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shield"]
